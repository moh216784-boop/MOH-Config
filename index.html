<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز  الفوري <title/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f9; }
        #map { height: 100%; min-height: 400px; border-radius: 1.5rem; z-index: 10; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #102a6b; border-radius: 10px; }
        .pulse-ring { animation: pulseRing 2s infinite; }
        @keyframes pulseRing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(29,78,216,0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(29,78,216,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(29,78,216,0); }
        }
        .gps-active-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #10b981; display: inline-block;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .proximity-bar-inner { transition: width 0.6s ease, background-color 0.6s ease; }
        .shake-anim { animation: shake 0.4s; }
        @keyframes shake {
            0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
        }
        .user-pulse-marker {
            width: 22px; height: 22px;
            background: #1d4ed8;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 0 0 rgba(29,78,216,0.7);
            animation: pulseMarker 1.8s infinite;
        }
        @keyframes pulseMarker {
            0% { box-shadow: 0 0 0 0 rgba(29,78,216,0.7); }
            70% { box-shadow: 0 0 0 14px rgba(29,78,216,0); }
            100% { box-shadow: 0 0 0 0 rgba(29,78,216,0); }
        }
        /* مودال تأكيد الحجز */
        #booking-modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #booking-modal.active { display: flex; }
        .booking-modal-box {
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .booking-success-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            animation: successPop 0.5s 0.2s both;
        }
        @keyframes successPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .fawri-logo-img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800">

    <!-- مودال تأكيد الحجز -->
    <div id="booking-modal">
        <div class="booking-modal-box">
            <div class="booking-success-icon">
                <i class="fas fa-check text-white text-3xl"></i>
            </div>
            <h2 class="text-xl font-black text-gray-800 mb-1">✅ تم الحجز بنجاح!</h2>
            <p class="text-sm text-gray-500 mb-4">رقم الحجز الخاص بك:</p>
            <div class="bg-blue-50 border-2 border-dashed border-blue-200 rounded-xl py-3 px-4 mb-4">
                <span id="modal-booking-id" class="text-lg font-black text-blue-900 font-mono"></span>
            </div>
            <div class="bg-gray-50 rounded-xl p-3 text-right text-xs space-y-1.5 mb-5">
                <div class="flex justify-between"><span class="text-gray-400">المنشأة:</span><span id="modal-place" class="font-bold text-gray-700"></span></div>
                <div class="flex justify-between"><span class="text-gray-400">الخدمة:</span><span id="modal-service" class="font-bold text-gray-700"></span></div>
                <div class="flex justify-between"><span class="text-gray-400">الاسم:</span><span id="modal-name" class="font-bold text-gray-700"></span></div>
                <div class="flex justify-between"><span class="text-gray-400">الولاية:</span><span id="modal-state" class="font-bold text-gray-700"></span></div>
                <div class="flex justify-between"><span class="text-gray-400">وقت الحجز:</span><span id="modal-time" class="font-bold text-gray-700"></span></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="closeBookingModal()" class="py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 font-bold text-sm hover:bg-gray-50">إغلاق</button>
                <button onclick="proceedToTicket()" class="py-2.5 rounded-xl text-white font-bold text-sm" style="background:#102a6b;">عرض التذكرة</button>
            </div>
        </div>
    </div>

    <!-- شريط الهوية الرسمي لفوري -->
    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3 space-x-reverse">

    <main class="max-w-6xl w-full mx-auto px-3 py-5 flex-1 flex flex-col justify-center items-center">
        <div class="w-full bg-white rounded-3xl p-5 shadow-sm border border-gray-100 min-h-[550px] flex flex-col justify-between relative">
            
            <button id="back-flow-btn" onclick="triggerPrevStep()" class="absolute top-5 left-5 text-xs font-bold text-gray-400 hover:text-blue-900 hidden items-center space-x-1 space-x-reverse transition z-20">

            </button>

            <!-- ===== الخطوة 1: البطاقة البيومترية ===== -->
            <div id="step-view-1" class="flow-step-view space-y-4 max-w-md mx-auto w-full text-center py-6">
                <div class="w-16 h-16 bg-blue-50 text-blue-900 rounded-2xl flex items-center justify-center text-2xl mx-auto border border-blue-100"><i class="fas fa-id-card"></i></div>
                <h2 class="text-xl font-black text-gray-800">التعرف البيومتري الذكي</h2>

                <input type="text" id="user-card-name" placeholder="الاسم الكامل..." class="w-full border border-gray-200 rounded-xl p-3.5 focus:border-blue-900 focus:outline-none text-sm font-bold text-center text-gray-700 shadow-sm">

                    <span id="gps-status-text">جاري تحديد موقعك الجغرافي عبر GPS...</span>
                </div>
                <button onclick="submitLoginStep()" class="w-full text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm" style="background-color:#102a6b;">
                    تحقق من البطاقة والموقع الجغرافي <i class="fas fa-location-arrow mr-1"></i>
                </button>
            </div>

    function selectState(code) {
        selectedStateCode = code;
        document.querySelectorAll('.state-card').forEach(el => {
            el.classList.remove('border-blue-900', 'bg-blue-50');
            el.classList.add('border-gray-100', 'bg-white');
        });
        document.querySelectorAll('[id^="check-"]').forEach(el => el.classList.add('hidden'));
        const card = document.getElementById(`state-card-${code}`);
        if (card) { card.classList.add('border-blue-900', 'bg-blue-50'); card.classList.remove('border-gray-100', 'bg-white'); }
        const check = document.getElementById(`check-${code}`);
        if (check) check.classList.remove('hidden');
        sessionData.state = algerianStates.find(s => s.code === code);
    }

    function initGPS() {
        if (!navigator.geolocation) {
            document.getElementById('gps-status-text').innerText = 'GPS غير متوفر. سيتم استخدام إحداثيات افتراضية.';
            return;
        }
        document.getElementById('gps-status-text').innerText = 'جاري تحديد موقعك الدقيق...';
        navigator.geolocation.getCurrentPosition(
            pos => {
                sessionData.userLat = pos.coords.latitude;
                sessionData.userLon = pos.coords.longitude;
                document.getElementById('gps-status-text').innerText = `✅ تم تحديد موقعك: ${pos.coords.latitude.toFixed(4)}°N, ${pos.coords.longitude.toFixed(4)}°E (دقة: ${Math.round(pos.coords.accuracy)}م)`;
                document.getElementById('gps-status-box').className = 'bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs font-bold text-emerald-800 flex items-center justify-center gap-2';
            },
            err => {
                document.getElementById('gps-status-text').innerText = `⚠️ تعذر الوصول للـ GPS (${err.message}). سيتم استخدام إحداثيات الولاية المختارة.`;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function startRealTimeGPS() {
        if (!navigator.geolocation) return;
        gpsWatchId = navigator.geolocation.watchPosition(
            pos => {
                sessionData.userLat = pos.coords.latitude;
                sessionData.userLon = pos.coords.longitude;
                if (userLocationMarker && !busSimRunning) {
                    userLocationMarker.setLatLng([sessionData.userLat, sessionData.userLon]);
                    updateProximityDisplay(sessionData.userLat, sessionData.userLon, sessionData.targetLat, sessionData.targetLon);
                }
            },
            err => console.warn('GPS Watch:', err.message),
            { enableHighAccuracy: true, maximumAge: 2000 }
        );
    }

    function stopRealTimeGPS() {
        if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
    }

        if (Math.abs(sessionData.userLat - 36.752) < 0.01 && Math.abs(sessionData.userLon - 3.048) < 0.01) {
            sessionData.userLat = sessionData.state.lat;
            sessionData.userLon = sessionData.state.lon;
        }
        switchFlowToStep(3);
    }

        sessionData.serviceType = serviceKey;
        switchFlowToStep(4);
        if (!mapInstance) {

    function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateProximityDisplay(userLat, userLon, targetLat, targetLon) {
        if (!targetLat || !targetLon) return;
        const distKm = haversineKm(userLat, userLon, targetLat, targetLon);
        const durationMin = Math.max(1, Math.round((distKm / 40) * 60) + 2);
        document.getElementById('lbl-live-distance').innerText = `${distKm.toFixed(2)} كم`;
        document.getElementById('lbl-live-duration').innerText = `${durationMin} دق`;
        document.getElementById('lbl-remaining').innerText = distKm < 0.1 ? 'وصلت!' : `${distKm.toFixed(2)} كم`;
        sessionData.totalDistance = distKm;
        sessionData.durationMinutes = durationMin;
        const maxDist = 10;
        const percentage = Math.max(0, Math.min(100, (1 - distKm / maxDist) * 100));
        const bar = document.getElementById('proximity-bar');
        bar.style.width = percentage + '%';
        if (distKm <= 0.3) bar.style.backgroundColor = '#10b981';
        else if (distKm <= 1.0) bar.style.backgroundColor = '#f59e0b';
        else bar.style.backgroundColor = '#ef4444';
        const badge = document.getElementById('distance-status-badge');
        const indicator = document.getElementById('proximity-indicator');
        const proximityText = document.getElementById('proximity-text');
        indicator.classList.remove('hidden');
        if (distKm <= 0.3) {
            badge.innerText = '✅ وصلت تقريباً!'; badge.style.cssText = 'background:#10b981;color:white;';
            indicator.style.cssText = 'background:#d1fae5;color:#065f46;'; proximityText.innerText = '🎉 أنت على بُعد خطوات من وجهتك!';
        } else if (distKm <= 1.0) {
            badge.innerText = '🚶 قريب (مشياً)'; badge.style.cssText = 'background:#f59e0b;color:white;';
            indicator.style.cssText = 'background:#fef3c7;color:#92400e;'; proximityText.innerText = `⚡ أنت قريب جداً! ${distKm.toFixed(0)} م فقط`;
        } else if (distKm <= 3.0) {
            badge.innerText = '🚌 يُنصح بالحافلة'; badge.style.cssText = 'background:#3b82f6;color:white;';
            indicator.style.cssText = 'background:#eff6ff;color:#1e40af;'; proximityText.innerText = `🚌 ${distKm.toFixed(1)} كم • تقدر تركب الحافلة`;
        } else {
            badge.innerText = '🚌 يجب ركوب الحافلة'; badge.style.cssText = 'background:#ef4444;color:white;';
            indicator.style.cssText = 'background:#fef2f2;color:#991b1b;'; proximityText.innerText = `📍 ${distKm.toFixed(1)} كم • ركوب الحافلة ضروري`;
        }
    }

    function selectAndRouteToPlace(lat, lon, name, index) {
        sessionData.targetLat = lat; sessionData.targetLon = lon; sessionData.selectedPlaceName = name;
        document.querySelectorAll('.place-card-item').forEach(el => { el.classList.remove('border-blue-900', 'bg-blue-50'); el.classList.add('border-gray-100', 'bg-white'); });
        const card = document.getElementById(`place-item-${index}`);
        if (card) { card.classList.add('border-blue-900', 'bg-blue-50'); card.classList.remove('border-gray-100', 'bg-white'); }
        if (routePolyline) mapInstance.removeLayer(routePolyline);
        routePolyline = L.polyline([[sessionData.userLat, sessionData.userLon], [lat, lon]], { color: '#f57c00', weight: 5, dashArray: '8, 12', opacity: 0.9 }).addTo(mapInstance);
        mapInstance.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
        updateProximityDisplay(sessionData.userLat, sessionData.userLon, lat, lon);
    }

    function startBusSimulation() {
        if (!sessionData.targetLat) { alert('اختر منشأة أولاً!'); return; }
        if (busSimRunning) return;
        busSimRunning = true;
        document.getElementById('simulate-nav-btn').classList.add('hidden');
        document.getElementById('stop-nav-btn').classList.remove('hidden');
        document.getElementById('stop-nav-btn').classList.add('flex');
        document.getElementById('nav-progress-wrap').classList.remove('hidden');
        const startLat = sessionData.userLat, startLon = sessionData.userLon;
        let steps = 0;
        const totalSteps = 30;

        simulatedBusInterval = setInterval(() => {
            steps++;
            const ratio = steps / totalSteps;
            const currentLat = startLat + (sessionData.targetLat - startLat) * ratio;
            const currentLon = startLon + (sessionData.targetLon - startLon) * ratio;
            if (userLocationMarker) { userLocationMarker.setLatLng([currentLat, currentLon]); mapInstance.setView([currentLat, currentLon], 15, { animate: true }); }
            const remaining = haversineKm(currentLat, currentLon, sessionData.targetLat, sessionData.targetLon);
            const bar = document.getElementById('nav-progress-bar');
            bar.style.width = (ratio * 100) + '%';
            const el = document.getElementById('nav-instruction-text');
            if (ratio < 0.33) { el.innerText = `🚌 الحافلة تسير... ${remaining.toFixed(2)} كم متبقية`; el.style.color = '#1d4ed8'; }
            else if (ratio < 0.66) { el.innerText = `🛣️ في منتصف الطريق! ${remaining.toFixed(2)} كم`; el.style.color = '#f57c00'; }
            else if (ratio < 0.95) { el.innerText = `⚡ اقتربت! ${(remaining * 1000).toFixed(0)} متر متبقياً`; el.style.color = '#059669'; }
            else { el.innerText = `🎉 وصلت! يمكنك الآن تأكيد الحجز`; el.style.color = '#059669'; }
            updateProximityDisplay(currentLat, currentLon, sessionData.targetLat, sessionData.targetLon);
            if (routePolyline) mapInstance.removeLayer(routePolyline);
            routePolyline = L.polyline([[currentLat, currentLon], [sessionData.targetLat, sessionData.targetLon]], { color: '#f57c00', weight: 5, dashArray: '8,12', opacity: 0.9 }).addTo(mapInstance);
            if (steps >= totalSteps) {
                clearInterval(simulatedBusInterval);
                busSimRunning = false;
                userLocationMarker.setLatLng([sessionData.targetLat, sessionData.targetLon]);
                document.getElementById('stop-nav-btn').classList.add('hidden');
                document.getElementById('stop-nav-btn').classList.remove('flex');
            }
        }, 700);
    }

    function useMyLocationAsFrom() {
        document.getElementById('travel-from').value = `موقعي الحالي (${sessionData.userLat.toFixed(4)}°N, ${sessionData.userLon.toFixed(4)}°E)`;
        updateTravelRouteInfo();
    }

    function useSelectedPlaceAsTo() {
        if (sessionData.selectedPlaceName) document.getElementById('travel-to').value = sessionData.selectedPlaceName;
        updateTravelRouteInfo();
    }

    function updateTravelRouteInfo() {
        const from = document.getElementById('travel-from').value.trim();
        const to = document.getElementById('travel-to').value.trim();
        const infoBox = document.getElementById('travel-route-info');
        if (from && to) {
            infoBox.classList.remove('hidden');
            const dist = sessionData.totalDistance > 0 ? ` • ${sessionData.totalDistance.toFixed(2)} كم` : '';
            document.getElementById('travel-route-text').innerText = `${from.substring(0,18)}...  ←→  ${to.substring(0,18)}...${dist}`;
        } else { infoBox.classList.add('hidden'); }
    }

    function stopBusSimulation() {
        if (simulatedBusInterval) clearInterval(simulatedBusInterval);
        busSimRunning = false;
        document.getElementById('simulate-nav-btn').classList.remove('hidden');
        document.getElementById('stop-nav-btn').classList.add('hidden');
        document.getElementById('stop-nav-btn').classList.remove('flex');
        document.getElementById('nav-instruction-text').innerText = '';
        document.getElementById('nav-progress-bar').style.width = '0%';
    }

    function openBookingModal() {
        if (!sessionData.selectedPlaceName) { alert('يرجى اختيار منشأة أولاً من القائمة!'); return; }
        const bookingId = `FAWRI-${Math.floor(100000 + Math.random() * 900000)}`;
        pendingBookingId = bookingId;
        const now = new Date();
        const timeStr = now.toLocaleString('ar-DZ', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' });
        document.getElementById('modal-booking-id').innerText = bookingId;
        document.getElementById('modal-place').innerText = sessionData.selectedPlaceName.substring(0, 30) + '...';
        document.getElementById('modal-service').innerText = servicesDictionary[sessionData.serviceType];
        document.getElementById('modal-name').innerText = sessionData.username;
        document.getElementById('modal-state').innerText = sessionData.state.name.replace(/^\d+ - /, '');
        document.getElementById('modal-time').innerText = timeStr;
        document.getElementById('booking-modal').classList.add('active');
    }

    function closeBookingModal() {
        document.getElementById('booking-modal').classList.remove('active');
    }

    function proceedToTicket() {
        closeBookingModal();
        executeFinalFlow();
    }

    function executeFinalFlow() {
        if (simulatedBusInterval) clearInterval(simulatedBusInterval);
        stopRealTimeGPS();
        const bookingId = pendingBookingId || `FAWRI-${Math.floor(100000 + Math.random() * 900000)}`;
        document.getElementById('ticket-place-name').innerText = sessionData.selectedPlaceName || 'لم يتم الاختيار';
        document.getElementById('ticket-user-owner').innerText = `صاحب الحجز: ${sessionData.username}`;
        document.getElementById('ticket-state-lbl').innerText = sessionData.state.name;
        document.getElementById('ticket-service-lbl').innerText = servicesDictionary[sessionData.serviceType];
        document.getElementById('ticket-distance-lbl').innerText = `${sessionData.totalDistance.toFixed(2)} كم`;
        document.getElementById('ticket-time-lbl').innerText = `${sessionData.durationMinutes} دقيقة`;
        document.getElementById('ticket-serial').innerText = `ID: ${bookingId}`;
        document.getElementById('qrcode-container').innerHTML = '';
        new QRCode(document.getElementById('qrcode-container'), {
            text: `FAWRI|${bookingId}|${sessionData.username}|${sessionData.selectedPlaceName}|${sessionData.state.name}`,
            width: 100, height: 100, colorDark: "#102a6b", colorLight: "#ffffff"
        });
        switchFlowToStep(5);
    }

    function switchFlowToStep(targetStep) {
        currentFlowStep = targetStep;
        document.querySelectorAll('.flow-step-view').forEach(v => v.classList.add('hidden'));
        document.getElementById(`step-view-${targetStep}`).classList.remove('hidden');
        const backBtn = document.getElementById('back-flow-btn');
        (targetStep > 1 && targetStep < 5) ? backBtn.classList.replace('hidden', 'flex') : backBtn.classList.replace('flex', 'hidden');
        for (let i = 1; i <= 5; i++) {
            const ind = document.getElementById(`ind-${i}`);
            if (ind) ind.style.color = i === targetStep ? '#f57c00' : (i < targetStep ? '#102a6b' : '#9ca3af');
        }
        if (targetStep === 4 && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 200);
    }
