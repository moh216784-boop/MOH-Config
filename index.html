<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-5WXP3XDX');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف النور - الإصدار الذهبي الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #0f172a; }
        body { font-family: 'Tajawal', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 120px; }
        .container { max-width: 900px; margin: 0 auto; padding: 15px; }
        
        /* قسم مواقيت الصلاة اليدوي */
        .prayer-input-area { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--gold); text-align: center; }
        .prayer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; font-size: 0.8rem; }
        .p-time { color: var(--gold); font-weight: bold; display: block; }

        /* الأزرار الذهبية القديمة */
        .settings-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .control-btn { padding: 10px 5px; border-radius: 8px; border: 2px solid var(--gold); background: transparent; color: white; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .control-btn.active { background: var(--gold); color: black; font-weight: bold; }

        .nav-tabs { display: flex; background: rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: white; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: black; }

        .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--gold); background: rgba(255,255,255,0.1); color: white; margin-bottom: 15px; box-sizing: border-box; }
        
        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .item-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid rgba(212,175,55,0.2); }
        
        #reader-view { display: none; background: white; color: black; padding: 20px; border-radius: 20px; margin-top: 10px; }
        .ayah-block { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .ayah-text { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 2.5; }
        .tafseer-text { display: none; background: #f9f9f9; padding: 10px; font-size: 1rem; color: #444; border-right: 4px solid var(--gold); margin-top: 10px; }
        .show-tafseer .tafseer-text { display: block; }
        .tajweed-active .rule { color: #b45309; text-decoration: underline; }

        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 15px; border-top: 3px solid var(--gold); display: none; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5WXP3XDX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="container">
    <h1 style="text-align:center; color:var(--gold); margin:10px 0;">مصحف النور</h1>

    <div class="prayer-input-area">
        <input type="text" id="city-input" class="search-box" placeholder="اكتب اسم مدينتك (مثلاً: Algiers)" style="margin-bottom:5px;">
        <button onclick="updatePrayerTimes()" class="control-btn" style="width:100%; border-color:white;">تحديث مواقيت الصلاة</button>
        <div class="prayer-grid" id="prayer-display">
            <div>الفجر<span class="p-time" id="fajr">--:--</span></div>
            <div>الظهر<span class="p-time" id="dhuhr">--:--</span></div>
            <div>العصر<span class="p-time" id="asr">--:--</span></div>
            <div>المغرب<span class="p-time" id="maghrib">--:--</span></div>
            <div>العشاء<span class="p-time" id="isha">--:--</span></div>
        </div>
    </div>

    <div class="nav-tabs">
        <button id="q-tab" class="tab-btn active" onclick="switchTab('quran')">القرآن الكريم</button>
        <button id="h-tab" class="tab-btn" onclick="switchTab('hisn')">حصن المسلم</button>
    </div>

    <div id="quran-section">
        <div class="settings-bar">
            <button id="btn-audio" class="control-btn active" onclick="toggleOption('audio')">صوت</button>
            <button id="btn-tafseer" class="control-btn" onclick="toggleOption('tafseer')">تفسير</button>
            <button id="btn-tajweed" class="control-btn" onclick="toggleOption('tajweed')">تجويد</button>
            <button id="btn-auto" class="control-btn active" onclick="toggleOption('auto')">تلقائي</button>
        </div>
        <select id="reciter" class="search-box">
            <option value="ar.abdulsamad">عبد الباسط عبد الصمد</option>
            <option value="ar.alafasy">مشاري العفاسي</option>
            <option value="ar.dossari">ياسر الدوسري</option>
            <option value="ar.alijaber">علي جابر</option>
            <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
        </select>
        <input type="text" id="quran-search" class="search-box" placeholder="🔍 ابحث عن سورة..." oninput="filterItems('quran')">
        <div class="list-grid" id="surah-list"></div>
    </div>

    <div id="hisn-section" style="display:none;">
        <input type="text" id="hisn-search" class="search-box" placeholder="🔍 ابحث في الأذكار..." oninput="filterItems('hisn')">
        <div class="list-grid" id="zekr-list"></div>
    </div>

    <div id="reader-view">
        <button onclick="closeReader()" style="color:red; border:none; font-weight:bold; cursor:pointer;">✕ إغلاق</button>
        <h2 id="reader-title" style="text-align:center; color:#333;"></h2>
        <div id="reader-content"></div>
    </div>
</div>

<div class="player-bar" id="player-bar"><audio id="main-audio" controls autoplay></audio></div>

<script>
    let options = { audio: true, tafseer: false, tajweed: false, auto: true };
    const hisnData = [
        { title: "أذكار الصباح", content: ["أصبحنا وأصبح الملك لله والحمد لله", "الله لا إله إلا هو الحي القيوم", "قُلْ هُوَ اللَّهُ أَحَدٌ (3 مرات)"] },
        { title: "أذكار المساء", content: ["أمسينا وأمسى الملك لله", "يا حي يا قيوم برحمتك أستغيث", "رضيت بالله رباً وبالإسلام ديناً"] },
        { title: "أذكار النوم", content: ["باسمك ربي وضعت جنبي", "آمن الرسول بما أنزل إليه", "سورة الإخلاص والمعوذتين"] }
    ];

    async function updatePrayerTimes() {
        const city = document.getElementById('city-input').value || 'Algiers';
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=&method=3`);
            const data = await res.json();
            const t = data.data.timings;
            document.getElementById('fajr').innerText = t.Fajr;
            document.getElementById('dhuhr').innerText = t.Dhuhr;
            document.getElementById('asr').innerText = t.Asr;
            document.getElementById('maghrib').innerText = t.Maghrib;
            document.getElementById('isha').innerText = t.Isha;
        } catch(e) { alert("خطأ في اسم المدينة"); }
    }

    function switchTab(tab) {
        document.getElementById('quran-section').style.display = tab === 'quran' ? 'block' : 'none';
        document.getElementById('hisn-section').style.display = tab === 'hisn' ? 'block' : 'none';
        document.getElementById('q-tab').classList.toggle('active', tab === 'quran');
        document.getElementById('h-tab').classList.toggle('active', tab === 'hisn');
    }

    function toggleOption(opt) {
        options[opt] = !options[opt];
        document.getElementById(`btn-${opt}`).classList.toggle('active');
        renderAyahs();
    }

    async function loadQuran() {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const data = await res.json();
        const list = document.getElementById('surah-list');
        list.innerHTML = data.chapters.map(s => `<div class="item-card q-item" onclick="openSurah(${s.id}, '${s.name_arabic}')">${s.name_arabic}</div>`).join('');
    }

    function loadHisn() {
        const list = document.getElementById('zekr-list');
        list.innerHTML = hisnData.map((z, i) => `<div class="item-card h-item" onclick="openZekr(${i})">${z.title}</div>`).join('');
    }

    function filterItems(type) {
        const query = document.getElementById(type + '-search').value.toLowerCase();
        document.querySelectorAll('.' + type[0] + '-item').forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(query) ? "block" : "none";
        });
    }

    let currentAyahs = [];
    async function openSurah(id, name) {
        document.getElementById('reader-view').style.display = 'block';
        document.getElementById('reader-title').innerText = name;
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/${document.getElementById('reciter').value}`);
        const data = await res.json();
        currentAyahs = data.data.ayahs;
        renderAyahs();
    }

    function renderAyahs() {
        const container = document.getElementById('reader-content');
        container.className = (options.tafseer ? 'show-tafseer ' : '') + (options.tajweed ? 'tajweed-active' : '');
        container.innerHTML = currentAyahs.map((a, i) => `
            <div class="ayah-block" onclick="playAyah('${a.audio}', ${i})">
                <div class="ayah-text">${options.tajweed ? a.text.replace(/ن/g, '<span class="rule">ن</span>') : a.text}</div>
                <div class="tafseer-text">تفسير الآية متاح عند الاتصال..</div>
            </div>
        `).join('');
    }

    function openZekr(index) {
        document.getElementById('reader-view').style.display = 'block';
        document.getElementById('reader-title').innerText = hisnData[index].title;
        document.getElementById('reader-content').innerHTML = hisnData[index].content.map(z => `<div class="ayah-block">${z}</div>`).join('');
    }

    function playAyah(url, index) {
        if (!options.audio) return;
        const player = document.getElementById('main-audio');
        document.getElementById('player-bar').style.display = 'block';
        player.src = url;
        player.play();
    }

    function closeReader() { document.getElementById('reader-view').style.display = 'none'; }

    loadQuran();
    loadHisn();
    updatePrayerTimes();
</script>
</body>
</html>
