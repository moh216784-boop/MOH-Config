<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية عبد الحميد بن باديس</title>
    <style>
        /* تعريف حركة النبض (Glow) للعنوان */
        @keyframes glowingText {
            0% {
                color: #fff;
                text-shadow: 0 0 5px #fff, 0 0 10px #00c6ff, 0 0 20px #00c6ff;
                opacity: 1;
            }
            50% {
                color: #00e6ff;
                text-shadow: 0 0 10px #fff, 0 0 30px #00c6ff, 0 0 40px #00c6ff;
                opacity: 0.8;
            }
            100% {
                color: #fff;
                text-shadow: 0 0 5px #fff, 0 0 10px #00c6ff, 0 0 20px #00c6ff;
                opacity: 1;
            }
        }

        body {
            /* تعديل الخلفية لتكون بلون عادي ثابت (أزرق فاتح مريح) */
            background-color: #f0f8ff; 
            text-align: center;
            /* اللون الافتراضي للنصوص العادية */
            color: #333; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            /* تفعيل حركة النبض هنا */
            animation: glowingText 3s infinite; 
            padding: 10px;
        }

        .card {
            background: #ffffff; /* بطاقة بيضاء سادة */
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #ddd;
            margin-top: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        /* اللون الداكن للنص داخل البطاقة */
        .card p {
            color: #555;
            font-size: 1.1em;
        }
        
        img {
            margin-top: 20px;
            width: 100%;
            border-radius: 15px;
            border: 2px solid #ddd;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <h1>ثانوية عبد الحميد بن باديس</h1>

    <div class="card">
        <p>مرحباً بكم في الموقع الرسمي للثانوية</p>
        <img src="images.jpeg" alt="صورة الثانوية">
    </div>

</body>
</html>
