<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز فوري - نظام الحجز الفوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { font-family: "Cairo", sans-serif; }
        body { background: #f0f4f8; }
        #map { height:100%; min-height:380px; border-radius:1.2rem; z-index:10; }
        .custom-scrollbar::-webkit-scrollbar { width:5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background:#102a6b; border-radius:10px; }
        .gps-dot { width:9px; height:9px; border-radius:50%; background:#10b981; display:inline-block; animation:blink 1s infinite; flex-shrink:0; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .shake { animation:shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        .user-pulse { width:20px; height:20px; background:#1d4ed8; border-radius:50%; border:3px solid #fff; animation:pm 1.8s infinite; }
        @keyframes pm { 0%{box-shadow:0 0 0 0 rgba(29,78,216,0.7)} 70%{box-shadow:0 0 0 12px rgba(29,78,216,0)} 100%{box-shadow:0 0 0 0 rgba(29,78,216,0)} }
        .prox-bar { transition:width 0.6s ease, background-color 0.6s ease; }

        /* شاشة تسجيل الدخول */
        #login-screen {
            position:fixed; inset:0; background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#0f172a 100%);
            z-index:9999; display:flex; align-items:center; justify-content:center;
        }
        .login-card {
            background:rgba(255,255,255,0.05); backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.15); border-radius:28px;
            padding:40px 32px; max-width:380px; width:92%; text-align:center;
        }
        .google-btn {
            background:white; color:#374151; border:2px solid #e5e7eb;
            border-radius:14px; padding:14px 20px; width:100%; font-weight:700;
            font-size:14px; cursor:pointer; display:flex; align-items:center;
            justify-content:center; gap:12px; transition:all 0.2s;
        }
        .google-btn:hover { background:#f9fafb; box-shadow:0 4px 20px rgba(0,0,0,0.15); transform:translateY(-1px); }
        .google-icon { width:22px; height:22px; }

        /* مودال الحجز */
        #booking-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9998; align-items:center; justify-content:center; }
        #booking-modal.active { display:flex; }
        .modal-box { background:white; border-radius:24px; padding:28px 20px; max-width:380px; width:92%; text-align:center; animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes popIn { 0%{transform:scale(0.7);opacity:0} 100%{transform:scale(1);opacity:1} }
        .success-icon { width:68px; height:68px; background:linear-gradient(135deg,#10b981,#059669); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; animation:si 0.5s 0.15s both; }
        @keyframes si { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }

        /* شارة المستخدم */
        .user-badge { background:rgba(16,42,107,0.08); border:1px solid rgba(16,42,107,0.15); border-radius:12px; padding:6px 12px; display:flex; align-items:center; gap:8px; }
    </style>
</head>
