<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف النور - تجربة قراءة فريدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.95);
            --gold: #c5a059;
            --dark-blue: #1a2a3a;
            --accent: #27ae60;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1584281722572-683f2331592c?q=80&w=2070') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        .overlay-glass {
            background: rgba(26, 42, 58, 0.85);
            backdrop-filter: blur(10px);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            margin: 0;
            color: var(--gold);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: var(--glass);
            color: var(--dark-blue);
            font-size: 1.1rem;
            margin: 20px 0;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .reciter-select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: var(--gold);
            color: white;
            border: none;
            font-weight: bold;
        }

        .surah-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }

        .surah-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .surah-item:hover {
            background: var(--gold);
            transform: scale(1.05);
        }

        #reader-section {
            display: none;
            background: var(--glass);
            color: var(--dark-blue);
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .ayah {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.5;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            cursor: pointer;
        }

        .ayah.active {
            color: var(--accent);
            background: #f0fff4;
            border-radius: 10px;
        }

        .controls {
            position: sticky;
            bottom: 0;
            background: var(--dark-blue);
            padding: 15px;
            text-align: center;
            border-top: 2px solid var(--gold);
        }

        audio { width: 100%; height: 40px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body>

<div class="overlay-glass">
    <div class="main-container">
        <header>
            <h1>مصحف النور</h1>
            <p>رتل القرآن بجمالية وإتقان</p>
        </header>

        <select id="reciter" class="reciter-select">
            <option value="ar.alafasy">مشاري العفاسي</option>
            <option value="ar.minshawi">محمد صديق المنشاوي</option>
            <option value="ar.husary">محمود خليل الحصري</option>
            <option value="ar.abdulsamad">عبد الباسط عبد الصمد</option>
        </select>

        <input type="text" class="search-box" id="search" placeholder="ابحث عن سورة...">

        <div class="surah-list" id="surah-container">
            </div>

        <div id="reader-section">
            <button onclick="backToList()" style="background:none; border:none; cursor:pointer; color:var(--gold); font-weight:bold;">← العودة للقائمة</button>
            <h2 id="current-surah-title" style="text-align:center; color:var(--dark-blue);"></h2>
            <div id="ayahs-container"></div>
        </div>
    </div>
</div>

<div class="controls" id="audio-player-container" style="display:none;">
    <audio id="main-audio" controls autoplay></audio>
</div>

<script>
    let allSurahs = [];
    let currentAyahs = [];
    let currentAyahIndex = 0;

    // 1. جلب السور
    async function init() {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const data = await res.json();
        allSurahs = data.chapters;
        renderSurahs(allSurahs);
    }

    function renderSurahs(chapters) {
        const container = document.getElementById('surah-container');
        container.innerHTML = chapters.map(s => `
            <div class="surah-item" onclick="loadSurah(${s.id}, '${s.name_arabic}')">
                <div style="font-weight:bold;">${s.name_arabic}</div>
                <small>${s.verses_count} آية</small>
            </div>
        `).join('');
    }

    // 2. البحث
    document.getElementById('search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allSurahs.filter(s => s.name_arabic.includes(term));
        renderSurahs(filtered);
    });

    // 3. تحميل السورة والآيات
    async function loadSurah(id, name) {
        document.getElementById('surah-container').style.display = 'none';
        document.getElementById('search').style.display = 'none';
        const reader = document.getElementById('reader-section');
        reader.style.display = 'block';
        document.getElementById('current-surah-title').innerText = name;
        
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/${document.getElementById('reciter').value}`);
        const data = await res.json();
        currentAyahs = data.data.ayahs;
        
        displayAyahs();
    }

    function displayAyahs() {
        const container = document.getElementById('ayahs-container');
        container.innerHTML = currentAyahs.map((a, index) => `
            <div class="ayah" id="ayah-${index}" onclick="playAyah(${index})">
                ${a.text} <span style="color:var(--gold); font-size:1.2rem;">(${a.numberInSurah})</span>
            </div>
        `).join('');
    }

    // 4. نظام التشغيل التلقائي
    const audio = document.getElementById('main-audio');

    function playAyah(index) {
        currentAyahIndex = index;
        const ayah = currentAyahs[index];
        
        // تحديث الواجهة
        document.querySelectorAll('.ayah').forEach(el => el.classList.remove('active'));
        document.getElementById(`ayah-${index}`).classList.add('active');
        document.getElementById(`ayah-${index}`).scrollIntoView({ behavior: 'smooth', block: 'center' });

        // تشغيل الصوت
        document.getElementById('audio-player-container').style.display = 'block';
        audio.src = ayah.audio;
        audio.play();
    }

    audio.onended = () => {
        if (currentAyahIndex < currentAyahs.length - 1) {
            playAyah(currentAyahIndex + 1);
        }
    };

    function backToList() {
        document.getElementById('surah-container').style.display = 'grid';
        document.getElementById('search').style.display = 'block';
        document.getElementById('reader-section').style.display = 'none';
        audio.pause();
    }

    init();
</script>

</body>
</html>
