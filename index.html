<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5WXP3XDX');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>مصحف النور - تحكم كامل</title>
    <meta name="description" content="مصحف النور لقراءة واستماع القرآن الكريم بتصميم جزائري حديث.">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #0f172a; --bg-card: #ffffff; }
        body { font-family: 'Tajawal', sans-serif; background: var(--dark); color: white; margin: 0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .settings-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .control-btn { padding: 10px; border-radius: 10px; border: 2px solid var(--gold); background: transparent; color: white; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .control-btn.active { background: var(--gold); color: black; font-weight: bold; }
        .tajweed-active .rule-under { text-decoration: underline double var(--gold); text-underline-offset: 5px; color: #b45309; }
        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: none; margin: 15px 0; background: rgba(255,255,255,0.1); color: white; }
        .surah-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .surah-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.2); }
        #reader-section { display: none; background: white; color: #1a1a1a; padding: 25px; border-radius: 20px; margin-top: 15px; }
        .ayah-block { margin-bottom: 20px; padding: 15px; border-radius: 10px; transition: 0.3s; border-bottom: 1px solid #eee; }
        .ayah-text { font-family: 'Amiri', serif; font-size: 2rem; line-height: 2.2; text-align: center; cursor: pointer; }
        .tafseer-text { color: #555; background: #fdf6e3; padding: 10px; margin-top: 10px; display: none; border-radius: 5px; font-size: 1rem; border-right: 4px solid var(--gold); }
        .show-tafseer .tafseer-text { display: block; }
        .active-ayah { background: #fffcf0; }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 15px; border-top: 3px solid var(--gold); display: none; }
        audio { width: 100%; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5WXP3XDX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div class="container">
    <header style="text-align:center;">
        <h1 style="color:var(--gold); font-size:2.5rem; margin-bottom:5px;">مصحف النور</h1>
        <p>تحكم في ميزات القراءة لكل زر على حدة</p>
    </header>

    <div class="settings-bar">
        <button id="btn-audio" class="control-btn active" onclick="toggleOption('audio')">🔊 صوت</button>
        <button id="btn-tafseer" class="control-btn" onclick="toggleOption('tafseer')">📖 تفسير</button>
        <button id="btn-tajweed" class="control-btn" onclick="toggleOption('tajweed')">✨ تجويد</button>
        <button id="btn-auto" class="control-btn active" onclick="toggleOption('auto')">🔄 تلقائي</button>
    </div>

    <select id="reciter" class="search-box" style="background:var(--gold); color:black; font-weight:bold;">
        <option value="ar.alafasy">مشاري العفاسي</option>
        <option value="ar.minshawi">محمد صديق المنشاوي</option>
        <option value="ar.husary">محمود خليل الحصري</option>
    </select>

    <input type="text" class="search-box" id="search" placeholder="🔍 ابحث عن سورة...">
    <div class="surah-list" id="surah-container"></div>

    <div id="reader-section">
        <button onclick="location.reload()" style="color:red; border:none; background:none; cursor:pointer; font-weight:bold;">✕ رجوع</button>
        <h2 id="current-surah-title" style="text-align:center;"></h2>
        <div id="ayahs-container"></div>
    </div>
</div>

<div class="player-bar" id="player-bar">
    <audio id="main-audio" controls></audio>
</div>

<script>
    let options = { audio: true, tafseer: false, tajweed: false, auto: true };
    let currentAyahs = [];
    let currentIndex = 0;
    const audioPlayer = document.getElementById('main-audio');

    function toggleOption(opt) {
        options[opt] = !options[opt];
        document.getElementById(`btn-${opt}`).classList.toggle('active');
        if (opt === 'tafseer') document.getElementById('ayahs-container')?.classList.toggle('show-tafseer');
        if (opt === 'tajweed') document.getElementById('ayahs-container')?.classList.toggle('tajweed-active');
    }

    function markTajweed(text) {
        return text.replace(/([ًٌٍن] )(م|و|ي|ن|ل|ر)/g, '<span class="rule-under">$1$2</span>');
    }

    async function init() {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const data = await res.json();
        renderSurahs(data.chapters);
    }

    function renderSurahs(list) {
        document.getElementById('surah-container').innerHTML = list.map(s => `
            <div class="surah-item" onclick="loadSurah(${s.id}, '${s.name_arabic}')">
                <b>${s.name_arabic}</b>
            </div>
        `).join('');
    }

    // إضافة وظيفة البحث
    document.getElementById('search').addEventListener('input', function(e) {
        let filter = e.target.value.toLowerCase();
        let items = document.querySelectorAll('.surah-item');
        items.forEach(item => {
            if (item.innerText.toLowerCase().includes(filter)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });
    });

    async function loadSurah(id, name) {
        document.getElementById('surah-container').style.display = 'none';
        document.getElementById('search').style.display = 'none';
        document.getElementById('reader-section').style.display = 'block';
        document.getElementById('current-surah-title').innerText = name;

        const [resT, resF] = await Promise.all([
            fetch(`https://api.alquran.cloud/v1/surah/${id}/${document.getElementById('reciter').value}`),
            fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.jalalayn`)
        ]);
        
        const dataT = await resT.json();
        const dataF = await resF.json();

        currentAyahs = dataT.data.ayahs.map((a, i) => ({
            text: a.text,
            audio: a.audio,
            num: a.numberInSurah,
            tafseer: dataF.data.ayahs[i].text
        }));

        renderAyahs();
    }

    function renderAyahs() {
        const container = document.getElementById('ayahs-container');
        container.className = (options.tafseer ? 'show-tafseer ' : '') + (options.tajweed ? 'tajweed-active' : '');
        container.innerHTML = currentAyahs.map((a, i) => `
            <div class="ayah-block" id="block-${i}">
                <div class="ayah-text" onclick="handleAyahClick(${i})">
                    ${markTajweed(a.text)} <span style="color:var(--gold);">﴿${a.num}﴾</span>
                </div>
                <div class="tafseer-text">${a.tafseer}</div>
            </div>
        `).join('');
    }

    function handleAyahClick(index) {
        currentIndex = index;
        document.querySelectorAll('.ayah-block').forEach(b => b.classList.remove('active-ayah'));
        document.getElementById(`block-${index}`).classList.add('active-ayah');
        document.getElementById(`block-${index}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (options.audio) {
            document.getElementById('player-bar').style.display = 'block';
            audioPlayer.src = currentAyahs[index].audio;
            audioPlayer.play();
        }
    }

    audioPlayer.onended = () => {
        if (options.auto && currentIndex < currentAyahs.length - 1) {
            handleAyahClick(currentIndex + 1);
        }
    };

    init();
</script>
</body>
</html>
