<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية عبد الحميد بن باديس</title>
    <style>
        /* تعريف حركة تغيير الخلفية لجميع الألوان (تدرج سلس) */
        @keyframes rainbowBackground {
            0%   { background: linear-gradient(45deg, #ff0000, #ff7f00); } /* أحمر -> برتقالي */
            16%  { background: linear-gradient(45deg, #ff7f00, #ffff00); } /* برتقالي -> أصفر */
            33%  { background: linear-gradient(45deg, #ffff00, #00ff00); } /* أصفر -> أخضر */
            50%  { background: linear-gradient(45deg, #00ff00, #0000ff); } /* أخضر -> أزرق */
            66%  { background: linear-gradient(45deg, #0000ff, #4b0082); } /* أزرق -> نيلي */
            83%  { background: linear-gradient(45deg, #4b0082, #9400d3); } /* نيلي -> بنفسجي */
            100% { background: linear-gradient(45deg, #9400d3, #ff0000); } /* بنفسجي -> أحمر */
        }

        body {
            /* تفعيل حركة الخلفية المتغيرة لجميع الألوان */
            animation: rainbowBackground 10s infinite alternate; 
            text-align: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.6); /* بطاقة سوداء شفافة */
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            margin-top: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 { 
            font-size: 28px; 
            text-shadow: 0 0 10px #fff; 
            margin-bottom: 10px;
        }
        
        .card p {
            margin: 0;
            font-size: 1.1em;
            color: #ccc;
        }
        
        img {
            margin-top: 20px;
            width: 100%;
            border-radius: 15px;
            border: 3px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* كود خاص لتلوين الاسم باللون الأخضر تحت الصورة */
        .signature {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #00ff00; /* اللون الأخضر الثابت */
            text-shadow: 0 0 5px #00ff00; /* توهج أخضر بسيط */
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>ثانوية عبد الحميد بن باديس</h1>

    <div class="card">
        <p>مرحباً بكم في الموقع الرسمي للثانوية</p>
        
        <img src="images.jpeg" alt="صورة الثانوية">
        
        <div class="signature">MOH CHAKOUR</div>
    </div>

</body>
</html>
