<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>مصحف النور - القرآن الكريم كاملاً (تفسير وتلاوة)</title>
    <meta name="description" content="مصحف النور: تجربة تفاعلية لقراءة واستماع القرآن الكريم بصوت كبار القراء مع ميزات التفسير والتجويد الآلي. صُمم ليكون بسيطاً وسريعاً للجميع.">
    <meta name="keywords" content="مصحف النور, القرآن الكريم, قرآن الجزائر, استماع وتفسير, العفاسي, المنشاوي, تجويد القرآن">
    <meta name="author" content="Shadow">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #0f172a; --bg-card: #ffffff; }
        body { font-family: 'Tajawal', sans-serif; background: var(--dark); color: white; margin: 0; min-height: 100vh; scroll-behavior: smooth; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }

        /* شريط الأزرار */
        .settings-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .control-btn {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--gold);
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .control-btn.active { background: var(--gold); color: black; font-weight: bold; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }

        /* التجويد */
        .tajweed-active .rule-under { 
            color: #b45309;
            font-weight: bold;
            border-bottom: 2px dashed var(--gold);
        }

        /* البحث والقائمة */
        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid rgba(212, 175, 55, 0.2); margin: 15px 0; background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; font-family: 'Tajawal'; }
        .search-box:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.1); }
        
        .surah-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .surah-item { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.1); transition: 0.3s; }
        .surah-item:hover { background: rgba(212, 175, 55, 0.1); transform: translateY(-3px); border-color: var(--gold); }
        
        /* قسم القراءة */
        #reader-section { display: none; background: white; color: #1a1a1a; padding: 25px; border-radius: 20px; margin-top: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .ayah-block { margin-bottom: 15px; padding: 20px; border-radius: 15px; transition: 0.4s; border-bottom: 1px solid #f0f0f0; }
        .ayah-text { font-family: 'Amiri', serif; font-size: 2.2rem; line-height: 2.5; text-align: center; cursor: pointer; word-spacing: 5px; }
        .tafseer-text { color: #444; background: #fdf6e3; padding: 15px; margin-top: 15px; display: none; border-radius: 8px; font-size: 1.1rem; border-right: 5px solid var(--gold); line-height: 1.6; }
        
        .show-tafseer .tafseer-text { display: block; }
        .active-ayah { background: #fffcf0; border: 1px solid var(--gold); transform: scale(1.02); }

        /* مشغل الصوت */
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 20px; border-top: 4px solid var(--gold); display: none; z-index: 1000; }
        audio { width: 100%; height: 40px; }

        .loader { text-align: center; padding: 20px; display: none; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; padding: 30px 0;">
        <h1 style="color:var(--gold); font-size:3rem; margin:0;">مصحف النور</h1>
        <p style="opacity:0.8;">تطبيق القرآن الكريم التفاعلي - نسخة الجزائر</p>
    </header>

    <div class="settings-bar">
        <button id="btn-audio" class="control-btn active" onclick="toggleOption('audio')">🔊 صوت</button>
        <button id="btn-tafseer" class="control-btn" onclick="toggleOption('tafseer')">📖 تفسير</button>
        <button id="btn-tajweed" class="control-btn" onclick="toggleOption('tajweed')">✨ تجويد</button>
        <button id="btn-auto" class="control-btn active" onclick="toggleOption('auto')">🔄 تلقائي</button>
    </div>

    <div id="main-view">
        <select id="reciter" class="search-box" style="background:var(--gold); color:black; font-weight:bold; cursor:pointer;">
            <option value="ar.alafasy">مشاري العفاسي</option>
            <option value="ar.minshawi">محمد صديق المنشاوي</option>
            <option value="ar.husary">محمود خليل الحصري</option>
            <option value="ar.abdulsamad">عبد الباسط عبد الصمد</option>
        </select>

        <input type="text" class="search-box" id="search" placeholder="🔍 ابحث عن اسم السورة...">
        <div id="loading" class="loader">جاري التحميل...</div>
        <div class="surah-list" id="surah-container"></div>
    </div>

    <div id="reader-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="goBack()" style="color:red; border:2px solid red; background:none; padding:5px 15px; border-radius:8px; cursor:pointer; font-weight:bold;">✕ إغلاق</button>
            <h2 id="current-surah-title" style="margin:0; color:var(--dark);"></h2>
        </div>
        <div id="ayahs-container"></div>
    </div>
</div>

<div class="player-bar" id="player-bar">
    <audio id="main-audio" controls autoplay></audio>
</div>

<script>
    let options = { audio: true, tafseer: false, tajweed: false, auto: true };
    let currentAyahs = [];
    let currentIndex = 0;
    const audioPlayer = document.getElementById('main-audio');

    // 1. نظام التبديل بين الخيارات
    function toggleOption(opt) {
        options[opt] = !options[opt];
        document.getElementById(`btn-${opt}`).classList.toggle('active');
        
        const container = document.getElementById('ayahs-container');
        if (container) {
            if (opt === 'tafseer') container.classList.toggle('show-tafseer');
            if (opt === 'tajweed') container.classList.toggle('tajweed-active');
        }
    }

    // 2. محرك البحث الذكي
    document.getElementById('search').addEventListener('input', function(e) {
        let filter = e.target.value.trim().toLowerCase();
        let items = document.querySelectorAll('.surah-item');
        items.forEach(item => {
            let name = item.innerText.toLowerCase();
            item.style.display = name.includes(filter) ? "block" : "none";
        });
    });

    // 3. محاكة التجويد
    function markTajweed(text) {
        // تمييز بسيط لبعض أحكام النون الساكنة والتنوين (كمثال)
        return text.replace(/([ًٌٍن] )(م|و|ي|ن|ل|ر)/g, '<span class="rule-under">$1$2</span>');
    }

    // 4. جلب قائمة السور
    async function init() {
        try {
            document.getElementById('loading').style.display = 'block';
            const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
            const data = await res.json();
            renderSurahs(data.chapters);
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            alert("حدث خطأ في الاتصال بالإنترنت");
        }
    }

    function renderSurahs(list) {
        document.getElementById('surah-container').innerHTML = list.map(s => `
            <div class="surah-item" onclick="loadSurah(${s.id}, '${s.name_arabic}')">
                <span style="display:block; font-size:0.8rem; color:var(--gold);">${s.id}</span>
                <b>${s.name_arabic}</b>
            </div>
        `).join('');
    }

    // 5. تحميل آيات السورة
    async function loadSurah(id, name) {
        window.scrollTo(0,0);
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('reader-section').style.display = 'block';
        document.getElementById('current-surah-title').innerText = "سورة " + name;
        document.getElementById('ayahs-container').innerHTML = "<p style='text-align:center;'>جاري تحميل الآيات والتفسير...</p>";

        try {
            const reciter = document.getElementById('reciter').value;
            const [resT, resF] = await Promise.all([
                fetch(`https://api.alquran.cloud/v1/surah/${id}/${reciter}`),
                fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.jalalayn`)
            ]);
            
            const dataT = await resT.json();
            const dataF = await resF.json();

            currentAyahs = dataT.data.ayahs.map((a, i) => ({
                text: a.text,
                audio: a.audio,
                num: a.numberInSurah,
                tafseer: dataF.data.ayahs[i].text
            }));

            renderAyahs();
        } catch (e) {
            alert("خطأ في تحميل بيانات السورة");
        }
    }

    function renderAyahs() {
        const container = document.getElementById('ayahs-container');
        container.className = (options.tafseer ? 'show-tafseer ' : '') + (options.tajweed ? 'tajweed-active' : '');
        
        container.innerHTML = currentAyahs.map((a, i) => `
            <div class="ayah-block" id="block-${i}" onclick="handleAyahClick(${i})">
                <div class="ayah-text">
                    ${options.tajweed ? markTajweed(a.text) : a.text} 
                    <span style="color:var(--gold); font-family:sans-serif; font-size:1.2rem;"> ﴿${a.num}﴾</span>
                </div>
                <div class="tafseer-text">${a.tafseer}</div>
            </div>
        `).join('');
    }

    // 6. التحكم بالصوت والتنقل
    function handleAyahClick(index) {
        currentIndex = index;
        
        document.querySelectorAll('.ayah-block').forEach(b => b.classList.remove('active-ayah'));
        const el = document.getElementById(`block-${index}`);
        el.classList.add('active-ayah');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });

        if (options.audio) {
            document.getElementById('player-bar').style.display = 'block';
            audioPlayer.src = currentAyahs[index].audio;
            audioPlayer.play().catch(e => console.log("Audio play blocked"));
        }
    }

    audioPlayer.onended = () => {
        if (options.auto && currentIndex < currentAyahs.length - 1) {
            handleAyahClick(currentIndex + 1);
        }
    };

    function goBack() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('reader-section').style.display = 'none';
        document.getElementById('player-bar').style.display = 'none';
        audioPlayer.pause();
    }

    init();
</script>

</body>
</html>
