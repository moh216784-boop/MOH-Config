<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية عبد الحميد بن باديس</title>
    <style>
        body {
            background: linear-gradient(to right, #1e90ff, #00c6ff);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-top: 30px;
            font-size: 28px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        img {
            margin-top: 20px;
            width: 90%; /* عرض الصورة ليكون مناسباً لشاشة الهاتف */
            max-width: 400px; /* لا تتجاوز هذا العرض */
            border-radius: 15px;
            border: 3px solid white;
        }
    </style>
</head>
<body>

    <h1>ثانوية عبد الحميد بن باديس</h1>

    <div class="container">
        <p>مرحباً بكم في الموقع</p>
        <img src="images.jpeg" alt="صورة الثانوية">

    </div>

</body>
</html>
