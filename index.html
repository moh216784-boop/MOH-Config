<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف النور - التجويد والتفسير</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #0f172a; --glass: rgba(255, 255, 255, 0.95); }
        body { font-family: 'Tajawal', sans-serif; background: var(--dark); color: white; margin: 0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* تلوين الأحكام */
        .tajweed-rule { text-decoration: underline cubic-bezier(0.4, 0, 0.2, 1) var(--gold); text-underline-offset: 8px; cursor: help; position: relative; }
        .tajweed-rule::after { content: attr(data-rule); position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 10px; background: var(--gold); color: black; padding: 2px 5px; border-radius: 4px; display: none; white-space: nowrap; }
        .tajweed-rule:hover::after { display: block; }

        /* الواجهة */
        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: none; margin: 20px 0; background: rgba(255,255,255,0.1); color: white; font-size: 1rem; }
        .surah-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .surah-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid rgba(212, 175, 55, 0.2); transition: 0.3s; }
        .surah-item:hover { background: var(--gold); color: black; }

        #reader-section { display: none; background: white; color: #1a1a1a; padding: 30px 15px; border-radius: 20px; margin-top: 20px; }
        .ayah { font-family: 'Amiri', serif; font-size: 2.2rem; line-height: 2.5; text-align: center; padding: 25px; border-bottom: 1px solid #eee; cursor: pointer; }
        .ayah.active { background: #fff9e6; }

        /* نافذة التفسير */
        .tafseer-box { font-size: 1.1rem; color: #444; background: #f9f9f9; padding: 15px; border-right: 5px solid var(--gold); margin-top: 10px; display: none; line-height: 1.6; }

        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 15px; border-top: 3px solid var(--gold); z-index: 1000; display: none; }
        audio { width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center;">
        <h1 style="color:var(--gold); font-family:'Amiri'; font-size:3rem;">مصحف النور</h1>
        <p>اضغط على الآية لسماعها ورؤية التفسير</p>
    </header>

    <select id="reciter" class="search-box" style="background:var(--gold); color:black; font-weight:bold;">
        <option value="ar.alafasy">مشاري العفاسي</option>
        <option value="ar.minshawi">محمد صديق المنشاوي</option>
        <option value="ar.husary">محمود خليل الحصري</option>
    </select>

    <input type="text" class="search-box" id="search" placeholder="🔍 ابحث عن سورة...">
    <div class="surah-list" id="surah-container"></div>

    <div id="reader-section">
        <button onclick="location.reload()" style="color:red; border:none; background:none; cursor:pointer; font-weight:bold; margin-bottom:20px;">✕ العودة للفهرس</button>
        <h2 id="current-surah-title" style="text-align:center;"></h2>
        <div id="ayahs-container"></div>
    </div>
</div>

<div class="player-bar" id="player-bar">
    <audio id="main-audio" controls></audio>
</div>

<script>
    let currentAyahs = [];
    let currentAyahIndex = 0;
    const audio = document.getElementById('main-audio');

    // وظيفة ذكية لتحديد أحكام التجويد نصياً
    function applyTajweedRules(text) {
        // مثال: إدغام (نون ساكنة أو تنوين بعدها م، و، ي، ن)
        let rules = [
            { regex: /([ًٌٍن] )(م|و|ي|ن)/g, label: 'إدغام بغنة', class: 'tajweed-rule' },
            { regex: /([ًٌٍن] )(ل|ر)/g, label: 'إدغام بغير غنة', class: 'tajweed-rule' },
            { regex: /([ًٌٍن] )(ب)/g, label: 'إقلاب', class: 'tajweed-rule' }
        ];
        
        rules.forEach(rule => {
            text = text.replace(rule.regex, `<span class="${rule.class}" data-rule="${rule.label}">$1$2</span>`);
        });
        return text;
    }

    async function init() {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const data = await res.json();
        renderSurahs(data.chapters);
    }

    function renderSurahs(chapters) {
        document.getElementById('surah-container').innerHTML = chapters.map(s => `
            <div class="surah-item" onclick="loadSurah(${s.id}, '${s.name_arabic}')">
                <b>${s.name_arabic}</b>
            </div>
        `).join('');
    }

    async function loadSurah(id, name) {
        document.getElementById('surah-container').style.display = 'none';
        document.getElementById('search').style.display = 'none';
        document.getElementById('reader-section').style.display = 'block';
        document.getElementById('current-surah-title').innerText = name;

        // جلب النص والتفسير والصوت في آن واحد
        const reciter = document.getElementById('reciter').value;
        const [resText, resTafseer] = await Promise.all([
            fetch(`https://api.alquran.cloud/v1/surah/${id}/${reciter}`),
            fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.jalalayn`)
        ]);
        
        const dataText = await resText.json();
        const dataTafseer = await resTafseer.json();
        
        currentAyahs = dataText.data.ayahs.map((ayah, i) => ({
            ...ayah,
            tafseer: dataTafseer.data.ayahs[i].text
        }));

        renderAyahs();
    }

    function renderAyahs() {
        const container = document.getElementById('ayahs-container');
        container.innerHTML = currentAyahs.map((a, i) => `
            <div class="ayah-wrapper">
                <div class="ayah" id="ayah-${i}" onclick="playAyah(${i})">
                    ${applyTajweedRules(a.text)} <span style="color:var(--gold); font-size:1.5rem;">﴿${a.numberInSurah}﴾</span>
                </div>
                <div class="tafseer-box" id="tafseer-${i}">${a.tafseer}</div>
            </div>
        `).join('');
    }

    function playAyah(index) {
        currentAyahIndex = index;
        const ayah = currentAyahs[index];
        
        // إظهار التفسير وإخفاء الباقي
        document.querySelectorAll('.tafseer-box').forEach(b => b.style.display = 'none');
        document.querySelectorAll('.ayah').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tafseer-${index}`).style.display = 'block';
        const el = document.getElementById(`ayah-${index}`);
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });

        document.getElementById('player-bar').style.display = 'block';
        audio.src = ayah.audio;
        audio.play();
    }

    audio.onended = () => {
        if (currentAyahIndex < currentAyahs.length - 1) playAyah(currentAyahIndex + 1);
    };

    init();
</script>

</body>
</html>
