<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5WXP3XDX');</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف النور - الإصدار الشامل</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #0f172a; --bg-light: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 100px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر والقائمة */
        .nav-tabs { display: flex; justify-content: space-around; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; color: white; cursor: pointer; padding: 10px; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

        /* قسم الصلاة */
        .prayer-card { background: linear-gradient(135deg, #1e293b, #334155); padding: 15px; border-radius: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 20px; border: 1px solid var(--gold); }
        .prayer-time { font-weight: bold; color: var(--gold); font-size: 1.1rem; }

        /* قسم حصن المسلم */
        .zekr-card { background: white; color: #333; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 5px solid var(--gold); cursor: pointer; }

        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: none; margin: 10px 0; background: rgba(255,255,255,0.1); color: white; font-family: 'Tajawal'; }
        .surah-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .surah-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.3s; }
        .surah-item:hover { background: var(--gold); color: black; }

        #reader-section, #hisn-section { display: none; background: white; color: #1a1a1a; padding: 20px; border-radius: 20px; }
        .ayah-text { font-family: 'Amiri', serif; font-size: 1.8rem; text-align: center; padding: 15px; line-height: 2.5; border-bottom: 1px solid #eee; }
        
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 15px; border-top: 3px solid var(--gold); display: none; }
        audio { width: 100%; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5WXP3XDX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="container">
    <h1 style="text-align:center; color:var(--gold);">مصحف النور</h1>

    <div id="prayer-times" class="prayer-card">
        <div>الفجر<br><span id="fajr" class="prayer-time">--:--</span></div>
        <div>الظهر<br><span id="dhuhr" class="prayer-time">--:--</span></div>
        <div>العصر<br><span id="asr" class="prayer-time">--:--</span></div>
        <div>المغرب<br><span id="maghrib" class="prayer-time">--:--</span></div>
        <div>العشاء<br><span id="isha" class="prayer-time">--:--</span></div>
        <div style="color:var(--gold)">القادم<br><span id="next-prayer">جاري التحميل..</span></div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showTab('quran')">📖 القرآن</button>
        <button class="tab-btn" onclick="showTab('hisn')">🛡️ حصن المسلم</button>
    </div>

    <div id="quran-tab">
        <select id="reciter" class="search-box" style="background:var(--gold); color:black; font-weight:bold;">
            <option value="ar.alafasy">مشاري العفاسي</option>
            <option value="ar.dossari">ياسر الدوسري</option>
            <option value="ar.alijaber">علي جابر</option>
            <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
            <option value="ar.abdulsamad">عبد الباسط عبد الصمد</option>
        </select>
        <input type="text" id="search" class="search-box" placeholder="🔍 ابحث عن سورة...">
        <div class="surah-list" id="surah-container"></div>
    </div>

    <div id="hisn-tab" style="display:none;">
        <div id="hisn-categories">
            <div class="zekr-card" onclick="loadZekr('اذكار الصباح')">☀️ أذكار الصباح</div>
            <div class="zekr-card" onclick="loadZekr('اذكار المساء')">🌙 أذكار المساء</div>
            <div class="zekr-card" onclick="loadZekr('اذكار النوم')">🛌 أذكار النوم</div>
            <div class="zekr-card" onclick="loadZekr('ادعية نبوية')">🤲 أدعية نبوية</div>
        </div>
    </div>

    <div id="reader-section">
        <button onclick="goBack()" style="color:red; border:none; cursor:pointer;">✕ إغلاق</button>
        <h2 id="view-title" style="text-align:center;"></h2>
        <div id="content-container"></div>
    </div>
</div>

<div class="player-bar" id="player-bar">
    <audio id="main-audio" controls autoplay></audio>
</div>

<script>
    // 1. برمجة مواقيت الصلاة
    async function getPrayerTimes() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=3`);
                const data = await res.json();
                const times = data.data.timings;
                document.getElementById('fajr').innerText = times.Fajr;
                document.getElementById('dhuhr').innerText = times.Dhuhr;
                document.getElementById('asr').innerText = times.Asr;
                document.getElementById('maghrib').innerText = times.Maghrib;
                document.getElementById('isha').innerText = times.Isha;
                document.getElementById('next-prayer').innerText = "محدثة الآن";
            });
        }
    }

    // 2. التنقل بين الأقسام
    function showTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('quran-tab').style.display = tab === 'quran' ? 'block' : 'none';
        document.getElementById('hisn-tab').style.display = tab === 'hisn' ? 'block' : 'none';
        document.getElementById('reader-section').style.display = 'none';
    }

    // 3. القرآن الكريم
    async function loadQuran() {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const data = await res.json();
        document.getElementById('surah-container').innerHTML = data.chapters.map(s => `
            <div class="surah-item" onclick="loadSurah(${s.id}, '${s.name_arabic}')">${s.name_arabic}</div>
        `).join('');
    }

    async function loadSurah(id, name) {
        document.getElementById('quran-tab').style.display = 'none';
        document.getElementById('reader-section').style.display = 'block';
        document.getElementById('view-title').innerText = name;
        const reciter = document.getElementById('reciter').value;
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${id}/${reciter}`);
        const data = await res.json();
        
        document.getElementById('content-container').innerHTML = data.data.ayahs.map((a, i) => `
            <div class="ayah-text" onclick="playAudio('${a.audio}')">
                ${a.text} <span style="color:var(--gold)">﴿${a.numberInSurah}﴾</span>
            </div>
        `).join('');
    }

    // 4. حصن المسلم (محاكاة بسيطة للمحتوى)
    function loadZekr(title) {
        document.getElementById('hisn-tab').style.display = 'none';
        document.getElementById('reader-section').style.display = 'block';
        document.getElementById('view-title').innerText = title;
        document.getElementById('content-container').innerHTML = `<p style='text-align:center; padding:20px;'>جاري جلب الأذكار المباركة...</p>`;
        // هنا يمكن ربط API أذكار خارجي أو كتابتها يدوياً
    }

    function playAudio(url) {
        document.getElementById('player-bar').style.display = 'block';
        const player = document.getElementById('main-audio');
        player.src = url;
        player.play();
    }

    function goBack() {
        location.reload();
    }

    getPrayerTimes();
    loadQuran();
</script>
</body>
</html>
