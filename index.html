<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موعدي الجزائر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100 p-4">

    <div class="w-full max-w-md bg-white rounded-[40px] shadow-2xl overflow-hidden border-8 border-gray-800 relative aspect-[9/19] flex flex-col justify-between">
        
        <div class="px-6 pt-3 flex justify-between items-center text-xs text-gray-700 font-bold z-10">
            <div>9:41</div>
            <div class="flex items-center space-x-1 space-x-reverse">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full text-lg"></i>
            </div>
        </div>

        <div class="px-6 pt-4 flex-1 overflow-y-auto pb-20">
            
            <div class="text-center my-4">
                <h1 class="text-[#2d6a4f] text-2xl font-bold mb-1">موعدي الجزائر</h1>
                <p class="text-gray-800 font-semibold text-base">مرحباً بك</p>
                <p class="text-gray-500 text-sm mt-1">اختر الخدمة التي تريدها</p>
            </div>

            <div class="grid grid-cols-3 gap-3 my-6">
                
                <button class="bg-[#e63946] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-user-md text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">المستشفيات</span>
                </button>

                <button class="bg-[#2a9d8f] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-square-p text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">مواقف السيارات</span>
                </button>

                <button class="bg-[#1d3557] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-bus text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">النقل والمحطات</span>
                </button>

                <button class="bg-[#e07a5f] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-scissors text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">صالونات الحلاقة</span>
                </button>

                <button class="bg-[#8338ec] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-building text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">البلديات</span>
                </button>

                <button class="bg-[#457b9d] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-envelope text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">البريد</span>
                </button>

                <button class="bg-[#4a4e69] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-ellipsis-h text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">المزيد</span>
                </button>

                <button class="bg-[#f4a261] text-white p-3 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:opacity-90 transition">
                    <i class="fas fa-utensils text-xl mb-2"></i>
                    <span class="text-xs font-bold whitespace-nowrap">المطاعم</span>
                </button>

            </div>

            <div class="bg-[#e9ecef] rounded-2xl p-4 flex justify-between items-center mt-6 shadow-inner">
                <div class="space-y-1">
                    <h3 class="text-gray-800 font-bold text-sm">حجز سريع</h3>
                    <p class="text-gray-600 text-xs font-semibold">احجز موعدك أو دورك الآن</p>
                    <p class="text-gray-500 text-[11px]">بسهولة وسرعة</p>
                </div>
                <div class="text-[#1d3557] bg-white p-3 rounded-xl shadow-sm">
                    <i class="fas fa-calendar-check text-2xl"></i>
                </div>
            </div>

        </div>

        <div class="absolute bottom-0 inset-x-0 bg-white border-t border-gray-100 px-6 py-2 flex justify-between items-center text-gray-400 z-10">
            <button class="flex flex-col items-center space-y-0.5 text-[#2d6a4f]">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] font-bold">الرئيسية</span>
            </button>
            <button class="flex flex-col items-center space-y-0.5 hover:text-[#2d6a4f] transition">
                <i class="fas fa-bell text-lg"></i>
                <span class="text-[10px] font-bold">الإشعارات</span>
            </button>
            <button class="flex flex-col items-center space-y-0.5 hover:text-[#2d6a4f] transition">
                <i class="fas fa-calendar-alt text-lg"></i>
                <span class="text-[10px] font-bold">حجوزاتي</span>
            </button>
            <button class="flex flex-col items-center space-y-0.5 hover:text-[#2d6a4f] transition">
                <i class="fas fa-user text-lg"></i>
                <span class="text-[10px] font-bold">الحساب</span>
            </button>
        </div>

    </div>

</body>
</html>
