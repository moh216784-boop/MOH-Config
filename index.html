<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية عبد الحميد بن باديس</title>
    <style>
        /* تعريف حركة الألوان */
        @keyframes spaceGlow {
            0% { background: linear-gradient(45deg, #1e90ff, #00c6ff); }
            50% { background: linear-gradient(45deg, #ff00ff, #7000ff); }
            100% { background: linear-gradient(45deg, #1e90ff, #00c6ff); }
        }

        body {
            animation: spaceGlow 5s infinite alternate; /* تفعيل الحركة */
            text-align: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.4);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            margin-top: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        h1 { font-size: 32px; text-shadow: 0 0 10px #fff; }
        
        img {
            margin-top: 20px;
            width: 100%;
            border-radius: 15px;
            border: 3px solid #fff;
            box-shadow: 0 0 15px #00c6ff;
        }
    </style>
</head>
<body>

    <h1>ثانوية عبد الحميد بن باديس</h1>

    <div class="card">
        <p>مرحباً بكم في الموقع الرسمي للثانوية</p>
        <img src="images.jpeg" alt="صورة الثانوية">
    </div>

</body>
</html>
