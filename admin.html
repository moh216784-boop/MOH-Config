<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فوري FAWRI - لوحة تحكم المحل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #f0f4ff; }
        .card-enter { animation: fadeUp 0.3s ease; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .badge-waiting  { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
        .badge-done     { background:#d1fae5; color:#065f46; border:1px solid #6ee7b7; }
        .badge-canceled { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
        .turn-circle {
            width:48px; height:48px; border-radius:50%;
            background:linear-gradient(135deg,#102a6b,#1d4ed8);
            color:white; font-weight:900; font-size:18px;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 12px rgba(16,42,107,0.3);
            flex-shrink:0;
        }
        .turn-circle.done { background:linear-gradient(135deg,#059669,#10b981); }
        .turn-circle.canceled { background:linear-gradient(135deg,#dc2626,#ef4444); }
    </style>
</head>
<body class="min-h-screen">

<!-- ===== الهيدر ===== -->
<header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-black" style="color:#102a6b;">
                فوري <span style="color:#f57c00;">FAWRI</span>
                <span class="text-sm font-bold text-gray-400 mr-2">• لوحة التحكم</span>
            </h1>
            <p class="text-[10px] text-gray-400 font-bold">قائمة الحجوزات المباشرة</p>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-xs font-bold text-green-600">مباشر</span>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-3 py-5 space-y-4">

    <!-- ===== فلاتر ===== -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
        <p class="text-xs font-black text-gray-700"><i class="fas fa-filter text-blue-900 ml-1"></i> فلترة الحجوزات</p>
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="text-[10px] font-bold text-gray-500 block mb-1">نوع الخدمة</label>
                <select id="filter-service" onchange="loadBookings()"
                    class="w-full border border-gray-200 rounded-xl p-2.5 text-xs font-bold bg-white">
                    <option value="">كل الخدمات</option>
                    <option value="transport">النقل والحافلات</option>
                    <option value="parking">مواقف السيارات</option>
                    <option value="hospital">المستشفيات</option>
                    <option value="post">بريد الجزائر</option>
                    <option value="municipality">البلديات</option>
                    <option value="barber">صالونات الحلاقة</option>
                    <option value="restaurant">المطاعم</option>
                    <option value="more">مرافق أخرى</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 block mb-1">التاريخ</label>
                <input type="date" id="filter-date" onchange="loadBookings()"
                    class="w-full border border-gray-200 rounded-xl p-2.5 text-xs font-bold bg-white">
            </div>
        </div>
    </div>

    <!-- ===== إحصائيات سريعة ===== -->
    <div class="grid grid-cols-3 gap-3">
        <div class="bg-blue-900 text-white rounded-2xl p-3 text-center shadow">
            <div class="text-2xl font-black" id="stat-total">0</div>
            <div class="text-[10px] font-bold text-blue-200">إجمالي الحجوزات</div>
        </div>
        <div class="bg-amber-500 text-white rounded-2xl p-3 text-center shadow">
            <div class="text-2xl font-black" id="stat-waiting">0</div>
            <div class="text-[10px] font-bold text-amber-100">في الانتظار</div>
        </div>
        <div class="bg-emerald-500 text-white rounded-2xl p-3 text-center shadow">
            <div class="text-2xl font-black" id="stat-done">0</div>
            <div class="text-[10px] font-bold text-emerald-100">تم خدمتهم</div>
        </div>
    </div>

    <!-- ===== قائمة الحجوزات ===== -->
    <div>
        <div class="flex justify-between items-center mb-3">
            <p class="text-sm font-black text-gray-800">
                <i class="fas fa-list-ol text-blue-900 ml-1"></i> قائمة الزبائن بالترتيب
            </p>
            <button onclick="loadBookings()"
                class="text-xs font-bold text-blue-900 bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-xl hover:bg-blue-100 transition">
                <i class="fas fa-sync-alt ml-1"></i> تحديث
            </button>
        </div>

        <!-- تحميل -->
        <div id="loading-state" class="text-center py-10 text-gray-400">
            <i class="fas fa-circle-notch fa-spin text-2xl text-blue-900 mb-2"></i>
            <p class="text-xs font-bold">جاري تحميل الحجوزات...</p>
        </div>

        <!-- فارغ -->
        <div id="empty-state" class="hidden text-center py-10 text-gray-400">
            <i class="fas fa-calendar-times text-4xl text-gray-200 mb-3"></i>
            <p class="text-sm font-bold text-gray-400">لا توجد حجوزات بعد</p>
            <p class="text-xs text-gray-300">سيظهر الزبائن هنا عند حجزهم</p>
        </div>

        <!-- القائمة -->
        <div id="bookings-list" class="space-y-3 hidden"></div>
    </div>
</main>

<script>
// ===== Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyDd4s5NFd3p2rPltkuzUAhJEH4QCSG6UpQ",
  authDomain: "fawri-booking.firebaseapp.com",
  projectId: "fawri-booking",
  storageBucket: "fawri-booking.firebasestorage.app",
  messagingSenderId: "887961682761",
  appId: "1:887961682761:web:9b424de47978209dd05098"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== تعيين تاريخ اليوم =====
window.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('filter-date').value = today;
    loadBookings();
});

// ===== تحميل الحجوزات المباشر =====
let unsubscribe = null;

function loadBookings() {
    const serviceFilter = document.getElementById('filter-service').value;
    const dateFilter    = document.getElementById('filter-date').value;

    document.getElementById('loading-state').classList.remove('hidden');
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('bookings-list').classList.add('hidden');

    if (unsubscribe) unsubscribe();

    let query = db.collection("bookings").orderBy("createdAt");
    if (serviceFilter) query = query.where("serviceType", "==", serviceFilter);
    if (dateFilter)    query = query.where("appointmentDate", "==", dateFilter);

    unsubscribe = query.onSnapshot((snapshot) => {
        document.getElementById('loading-state').classList.add('hidden');

        const bookings = [];
        snapshot.forEach(doc => bookings.push({ id: doc.id, ...doc.data() }));

        if (bookings.length === 0) {
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('bookings-list').classList.add('hidden');
            updateStats(0, 0, 0);
            return;
        }

        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('bookings-list').classList.remove('hidden');
        renderBookings(bookings);
    });
}

// ===== عرض الحجوزات =====
function renderBookings(bookings) {
    const list = document.getElementById('bookings-list');
    list.innerHTML = '';

    let waiting = 0, done = 0;

    bookings.forEach((b, index) => {
        const turn = index + 1;
        const status = b.status || 'waiting';
        if (status === 'waiting') waiting++;
        if (status === 'done') done++;

        const statusLabel = {
            waiting:  '<span class="badge-waiting text-[10px] font-black px-2 py-0.5 rounded-full">⏳ في الانتظار</span>',
            done:     '<span class="badge-done text-[10px] font-black px-2 py-0.5 rounded-full">✅ تم</span>',
            canceled: '<span class="badge-canceled text-[10px] font-black px-2 py-0.5 rounded-full">❌ ملغى</span>'
        }[status] || '';

        const turnClass = status === 'done' ? 'done' : status === 'canceled' ? 'canceled' : '';

        const card = document.createElement('div');
        card.className = 'card-enter bg-white rounded-2xl p-4 shadow-sm border border-gray-100';
        card.innerHTML = `
            <div class="flex items-start gap-3">
                <!-- رقم الدور -->
                <div class="turn-circle ${turnClass}">${turn}</div>

                <!-- بيانات الزبون -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                        <h3 class="text-sm font-black text-gray-800 truncate">${b.userName || 'غير محدد'}</h3>
                        ${statusLabel}
                    </div>
                    <div class="grid grid-cols-2 gap-1 mt-2 text-[10px] text-gray-500">
                        <span><i class="fas fa-phone text-blue-900 ml-1"></i>${b.phone || '--'}</span>
                        <span><i class="fas fa-clock text-orange-500 ml-1"></i>${b.appointmentTime || '--'}</span>
                        <span><i class="fas fa-concierge-bell text-purple-500 ml-1"></i>${b.serviceSubtype || '--'}</span>
                        <span><i class="fas fa-map-marker-alt text-red-400 ml-1"></i>${(b.state || '--').replace(/^\d+ - /, '')}</span>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1">
                        <i class="fas fa-building text-gray-300 ml-1"></i>${b.placeName || 'لم يحدد المنشأة'}
                    </p>
                    <p class="text-[9px] text-gray-300 mt-0.5 font-mono">${b.ticketSerial || ''}</p>
                </div>
            </div>

            <!-- أزرار الإجراءات -->
            ${status === 'waiting' ? `
            <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100">
                <button onclick="updateStatus('${b.id}', 'done')"
                    class="flex-1 bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl hover:bg-emerald-600 transition">
                    <i class="fas fa-check ml-1"></i> تم الخدمة
                </button>
                <button onclick="updateStatus('${b.id}', 'canceled')"
                    class="flex-1 bg-red-100 text-red-600 text-xs font-bold py-2 rounded-xl hover:bg-red-200 transition border border-red-200">
                    <i class="fas fa-times ml-1"></i> إلغاء
                </button>
                <button onclick="callClient('${b.phone}')"
                    class="w-10 h-9 bg-blue-50 text-blue-900 rounded-xl hover:bg-blue-100 transition border border-blue-200 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-phone text-xs"></i>
                </button>
            </div>
            ` : `
            <div class="mt-3 pt-3 border-t border-gray-100">
                <button onclick="updateStatus('${b.id}', 'waiting')"
                    class="text-xs font-bold text-gray-400 hover:text-blue-900 transition">
                    <i class="fas fa-undo ml-1"></i> إعادة للانتظار
                </button>
            </div>
            `}
        `;
        list.appendChild(card);
    });

    updateStats(bookings.length, waiting, done);
}

// ===== تحديث حالة الحجز =====
async function updateStatus(bookingId, newStatus) {
    try {
        await db.collection("bookings").doc(bookingId).update({
            status: newStatus,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (err) {
        alert('خطأ في التحديث: ' + err.message);
    }
}

// ===== الاتصال بالزبون =====
function callClient(phone) {
    if (phone && phone !== '--') {
        window.location.href = `tel:${phone}`;
    } else {
        alert('رقم الهاتف غير متوفر');
    }
}

// ===== تحديث الإحصائيات =====
function updateStats(total, waiting, done) {
    document.getElementById('stat-total').innerText   = total;
    document.getElementById('stat-waiting').innerText = waiting;
    document.getElementById('stat-done').innerText    = done;
}
</script>
</body>
</html>
