<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم فوري | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl font-black text-blue-900 mb-6">لوحة تحكم فوري - الحجوزات</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
                <p class="text-gray-500 text-sm">إجمالي الحجوزات</p>
                <p id="total-bookings" class="text-3xl font-black text-blue-900">0</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full text-sm text-right">
                <thead class="bg-blue-900 text-white">
                    <tr>
                        <th class="p-3">الاسم</th>
                        <th class="p-3">الخدمة</th>
                        <th class="p-3">التاريخ</th>
                        <th class="p-3">المنشأة</th>
                        <th class="p-3">رقم الدور</th>
                    </tr>
                </thead>
                <tbody id="bookings-table-body" class="divide-y divide-gray-100">
                    <!-- سيتم تعبئة البيانات هنا -->
                </tbody>
            </table>
        </div>
        <button onclick="clearData()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg text-xs font-bold">مسح جميع البيانات</button>
    </div>

    <script>
        function loadBookings() {
            const data = JSON.parse(localStorage.getItem('fawri_bookings') || '[]');
            const tbody = document.getElementById('bookings-table-body');
            document.getElementById('total-bookings').innerText = data.length;
            tbody.innerHTML = data.map(b => `
                <tr>
                    <td class="p-3">${b.username}</td>
                    <td class="p-3">${b.serviceType}</td>
                    <td class="p-3">${b.appointmentDate}</td>
                    <td class="p-3">${b.selectedPlaceName}</td>
                    <td class="p-3 font-bold">${b.turnNumber}</td>
                </tr>
            `).join('');
        }
        function clearData() { localStorage.removeItem('fawri_bookings'); loadBookings(); }
        loadBookings();
    </script>
</body>
</html>
